<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Ask questions across your company knowledge base.">
        <title>Operations Assistant</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
        <script src="{{ url_for('static', path='/app.js') }}" defer></script>
    </head>
    <body>
        <div class="page-shell">
            <header class="topbar">
                <a class="brand" href="/" aria-label="Operations Assistant home">
                    <span class="brand-mark" aria-hidden="true">OA</span>
                    <span>Operations Assistant</span>
                </a>
            </header>

            <main class="workspace">
                <section class="intro" id="intro">
                    <p class="eyebrow">Internal knowledge, one question away</p>
                    <h1>What do you need<br>to know?</h1>
                    <p class="intro-copy">
                        Ask about policies, incidents, deployments, and documents across your connected sources.
                    </p>
                    <div class="suggestions" aria-label="Suggested questions">
                        <button class="suggestion" type="button">Can we deploy on Friday?</button>
                        <button class="suggestion" type="button">What is the SEV-1 response time?</button>
                        <button class="suggestion" type="button">How is production access approved?</button>
                    </div>
                </section>

                <section class="conversation" id="conversation" aria-live="polite" aria-label="Conversation"></section>
            </main>

            <div class="composer-wrap">
                <form class="composer" id="ask-form">
                    <label class="sr-only" for="question">Ask a question</label>
                    <textarea
                        id="question"
                        name="question"
                        rows="1"
                        maxlength="500"
                        placeholder="Ask your knowledge base..."
                        required
                    ></textarea>
                    <button class="send-button" type="submit" aria-label="Send question">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 12h14M13 6l6 6-6 6"/>
                        </svg>
                    </button>
                </form>
                <p class="composer-note">Answers are grounded in connected company sources.</p>
            </div>
        </div>
    </body>
</html>
